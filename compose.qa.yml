# Isolated persistent PostgreSQL for QA; does not use the Windows PostgreSQL service.
services:
  postgres-qa:
    image: postgres:14-alpine
    ports:
      - "127.0.0.1:5433:5432"
    env_file:
      - ./openjob_api/.qa-postgres/docker.env
    environment:
      POSTGRES_USER: openjob_qa
      POSTGRES_DB: postgres
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openjob_qa -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_qa_data:
